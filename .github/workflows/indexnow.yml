name: Submit to IndexNow

on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types:
      - completed

jobs:
  submit:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create IndexNow key file
        run: |
          echo "${{ secrets.INDEXNOW_KEY }}" > ./${{ secrets.INDEXNOW_KEY }}.txt

      - name: Commit and push key file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ./${{ secrets.INDEXNOW_KEY }}.txt
          git commit -m "Add IndexNow key file" || echo "No changes to commit"
          git push

      - name: Submit URLs to IndexNow
        uses: bojieyang/indexnow-action@v1
        with:
          sitemap-location: 'https://lucky-bear-global.pro/sitemap.xml'
          key: ${{ secrets.INDEXNOW_KEY }}
          endpoint: 'https://yandex.com/indexnow'
