name: Submit to IndexNow

on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types:
      - completed

jobs:
  submit:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create IndexNow key file
        run: |
          echo "${{ secrets.INDEXNOW_KEY }}" > ./${{ secrets.INDEXNOW_KEY }}.txt

      - name: Commit and push key file
      continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ./${{ secrets.INDEXNOW_KEY }}.txt
          git commit -m "Add IndexNow key file" || echo "No changes to commit"
          git push

      - name: Submit URLs to IndexNow
        run: |
          curl -X POST "https://yandex.com/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "lucky-bear-global.pro",
              "key": "${{ secrets.INDEXNOW_KEY }}",
              "keyLocation": "https://lucky-bear-global.pro/${{ secrets.INDEXNOW_KEY }}.txt",
              "urlList": [
                "https://lucky-bear-global.pro/"
              ]
            }'
